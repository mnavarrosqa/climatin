name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEYSTORE_BASE64: ${{ secrets.CLIMATIN_KEYSTORE_BASE64 }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew --no-daemon :core:testDebugUnitTest
      # Las capturas no frenan la compilación si algo de Robolectric falla.
      - name: Capturas de pantalla
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      # Con el secreto CLIMATIN_KEYSTORE_BASE64 cargado, el release sale firmado para Play Store.
      - name: Clave de firma
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/climatin.jks"
          echo "CLIMATIN_KEYSTORE=$RUNNER_TEMP/climatin.jks" >> "$GITHUB_ENV"
      - name: Compilar
        env:
          CLIMATIN_KEYSTORE_PASSWORD: ${{ secrets.CLIMATIN_KEYSTORE_PASSWORD }}
          CLIMATIN_KEY_ALIAS: ${{ secrets.CLIMATIN_KEY_ALIAS }}
          CLIMATIN_KEY_PASSWORD: ${{ secrets.CLIMATIN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: clima-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            wear/build/outputs/apk/release/wear-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: app/build/capturas/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: climatin-play
          path: |
            app/build/outputs/bundle/release/app-release.aab
            wear/build/outputs/bundle/release/wear-release.aab
      # Publica la versión en el repo público de versiones (una sola vez por versionName).
      # La app la encuentra ahí y avisa que hay una nueva. Necesita el secreto RELEASES_TOKEN.
      - name: Publicar versión
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.RELEASES_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts | head -1)
          TAG="v$NAME"
          if gh release view "$TAG" --repo mnavarrosqa/climatin-releases > /dev/null 2>&1; then
            echo "La versión $TAG ya está publicada"
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk "climatin-$CODE.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "climatin-wear-$CODE.apk"
          NOTES="fastlane/metadata/android/es-419/changelogs/$CODE.txt"
          [ -f "$NOTES" ] || echo "Climatin $NAME" > "$NOTES"
          gh release create "$TAG" "climatin-$CODE.apk" "climatin-wear-$CODE.apk" \
            --repo mnavarrosqa/climatin-releases --title "Climatin $NAME" --notes-file "$NOTES"
