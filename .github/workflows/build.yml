name: Build APK

on:
  push:
    branches: [main]
    # La app de iPhone tiene su propia compilación (ios.yml): sus cambios no publican un APK.
    paths-ignore: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEYSTORE_BASE64: ${{ secrets.CLIMATIN_KEYSTORE_BASE64 }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew --no-daemon :core:testDebugUnitTest
      # Las capturas no frenan la compilación si algo de Robolectric falla.
      - name: Capturas de pantalla
        id: capturas
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testGithubDebugUnitTest
      # Con el secreto CLIMATIN_KEYSTORE_BASE64 cargado, el release sale firmado para Play Store.
      - name: Clave de firma
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/climatin.jks"
          echo "CLIMATIN_KEYSTORE=$RUNNER_TEMP/climatin.jks" >> "$GITHUB_ENV"
      - name: Compilar
        env:
          CLIMATIN_KEYSTORE_PASSWORD: ${{ secrets.CLIMATIN_KEYSTORE_PASSWORD }}
          CLIMATIN_KEY_ALIAS: ${{ secrets.CLIMATIN_KEY_ALIAS }}
          CLIMATIN_KEY_PASSWORD: ${{ secrets.CLIMATIN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleGithubDebug :app:assembleGithubRelease :app:bundlePlayRelease :wear:assembleRelease :wear:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: clima-apk
          path: |
            app/build/outputs/apk/github/debug/app-github-debug.apk
            app/build/outputs/apk/github/release/app-github-release.apk
            wear/build/outputs/apk/release/wear-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: app/build/capturas/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: climatin-play
          path: |
            app/build/outputs/bundle/playRelease/app-play-release.aab
            wear/build/outputs/bundle/release/wear-release.aab
      # Publica la versión en el repo público de versiones (una sola vez por versionName).
      # La app la encuentra ahí y avisa que hay una nueva. Necesita el secreto RELEASES_TOKEN.
      - name: Publicar versión
        id: publicar
        continue-on-error: true
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && env.RELEASES_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K\d+' app/build.gradle.kts | head -1)
          TAG="v$NAME"
          if ! gh repo view mnavarrosqa/climatin-releases > publicar.log 2>&1; then
            echo "::warning::No encuentro mnavarrosqa/climatin-releases: creá el repo público (con README) y dale acceso al token RELEASES_TOKEN (Contents: Read and write)."
            exit 1
          fi
          # Un repo sin commits no acepta versiones: se le agrega un README la primera vez.
          if ! gh api repos/mnavarrosqa/climatin-releases/commits?per_page=1 > /dev/null 2>&1; then
            printf '# Climatin\n\nVersiones de [Climatin](https://github.com/mnavarrosqa/climatin) para instalar en Android. Cada una trae el APK del teléfono y el del reloj.\n' > README.md.tmp
            gh api -X PUT repos/mnavarrosqa/climatin-releases/contents/README.md \
              -f message="README" -f content="$(base64 -w0 README.md.tmp)" > publicar.log 2>&1
          fi
          # Si quedó un borrador de un intento anterior, se borra; si ya está publicada, no se repite.
          DRAFT=$(gh release view "$TAG" --repo mnavarrosqa/climatin-releases --json isDraft -q .isDraft 2>/dev/null || echo "none")
          if [ "$DRAFT" = "false" ]; then
            echo "La versión $TAG ya está publicada"
            exit 0
          elif [ "$DRAFT" = "true" ]; then
            gh release delete "$TAG" --repo mnavarrosqa/climatin-releases --yes
          fi
          cp app/build/outputs/apk/github/release/app-github-release.apk "climatin-$CODE.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "climatin-wear-$CODE.apk"
          NOTES="fastlane/metadata/android/es-419/changelogs/$CODE.txt"
          [ -f "$NOTES" ] || echo "Climatin $NAME" > "$NOTES"
          gh release create "$TAG" "climatin-$CODE.apk" "climatin-wear-$CODE.apk" \
            --repo mnavarrosqa/climatin-releases --title "Climatin $NAME" --notes-file "$NOTES" 2>&1 | tee publicar.log
          exit "${PIPESTATUS[0]}"
      # Al final del log, para encontrarlo fácil: por qué fallaron las capturas, si fallaron.
      - name: Resumen de capturas
        if: always() && steps.capturas.outcome == 'failure'
        run: |
          echo "Las capturas fallaron. Primeros errores:"
          grep -h -A12 "<failure" app/build/test-results/testGithubDebugUnitTest/*.xml 2>/dev/null | head -60 || true
          ls app/build/test-results/testGithubDebugUnitTest 2>/dev/null || echo "Sin resultados: falló antes de correr los tests (ver el paso Capturas de pantalla)."
      # Capturas chicas en el log (base64), para revisarlas sin bajar el artifact.
      - name: Capturas en el log
        if: always() && steps.capturas.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -m pip install -q --user --break-system-packages pillow
          python3 - <<'PY'
          import base64, glob, io, os
          from PIL import Image
          for path in sorted(glob.glob("app/build/capturas/*.png")):
              image = Image.open(path).convert("RGB")
              image.thumbnail((480, 480))
              out = io.BytesIO()
              image.save(out, "JPEG", quality=80)
              print("CAPTURA", os.path.basename(path), base64.b64encode(out.getvalue()).decode())
          PY
      - name: Resumen de publicación
        if: always() && steps.publicar.outcome == 'failure'
        run: |
          echo "No se pudo publicar la versión:"
          cat publicar.log 2>/dev/null || true
