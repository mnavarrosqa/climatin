name: Build iOS

# La app de iPhone (carpeta ios/). Por ahora compila para el simulador, sin firmar: sirve para
# saber que el código está bien. La firma y TestFlight se suman con los secretos de Apple.
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Generar el proyecto
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compilar
        run: |
          set -o pipefail
          xcodebuild build \
            -project Climatin.xcodeproj \
            -scheme Climatin \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
